name: Generate Social Share Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy existing site files
        run: |
          mkdir -p share-output
          # Copy all HTML files from repo root to output
          cp -f *.html share-output/ 2>/dev/null || true
          # Copy any other static assets if they exist
          cp -rf css share-output/css 2>/dev/null || true
          cp -rf js share-output/js 2>/dev/null || true
          cp -rf images share-output/images 2>/dev/null || true
          cp -rf assets share-output/assets 2>/dev/null || true
          echo "Copied existing site files to share-output/"
          ls -la share-output/

      - name: Generate share pages
        run: node generate-share-pages.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './share-output'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
