<style>
.wtgs-featured-section {
  padding: 50px 0;
  background: #f6f4df;
  width: 100vw !important;
  max-width: 100vw !important;
  position: relative;
  left: 50%;
  transform: translateX(-50%);
  box-sizing: border-box;
}
.wtgs-featured-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1400px;
  margin: 0 auto 30px auto;
  padding: 0 40px;
}
.wtgs-featured-header h2 { font-size: 28px; font-weight: 700; color: #1a365d; margin: 0; }
.wtgs-featured-header a { color: #3182ce; text-decoration: none; font-weight: 600; font-size: 15px; }
.wtgs-featured-header a:hover { text-decoration: underline; }
.wtgs-adventures-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 40px;
}
.wtgs-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  transition: all 0.3s;
  cursor: pointer;
  display: block;
}
.wtgs-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 35px rgba(0,0,0,0.15);
}
.wtgs-card-image {
  height: 180px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wtgs-card-image img.wtgs-photo {
  width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;
}
.wtgs-card-image img.wtgs-cat-icon {
  width: 100px; height: 100px; position: relative; z-index: 1;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
}
.wtgs-card-category {
  position: absolute; top: 12px; left: 12px;
  background: #1a1a1a; color: #f6d13b;
  padding: 6px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; z-index: 2;
}
.wtgs-card-content { padding: 20px; }
.wtgs-card-title { font-size: 18px; font-weight: 700; color: #1a365d; margin: 0 0 8px 0; }
.wtgs-card-desc { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 16px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wtgs-card-location { color: #64748b; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.wtgs-card-location svg { width: 14px; height: 14px; fill: currentColor; }
.wtgs-loading { text-align: center; padding: 60px 20px; color: #64748b; font-size: 16px; }
.wtgs-loading-spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #FFCE00; border-radius: 50%; animation: wtgs-spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes wtgs-spin { to { transform: rotate(360deg); } }

/* Modal */
.wtgs-modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); z-index: 10000;
  justify-content: center; align-items: center; padding: 20px;
}
.wtgs-modal-overlay.open { display: flex; }
.wtgs-modal {
  background: #fff; border-radius: 16px; max-width: 600px; width: 100%;
  max-height: 90vh; overflow-y: auto; position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.wtgs-modal-hero {
  height: 260px; position: relative; overflow: hidden;
  border-radius: 16px 16px 0 0;
  display: flex; align-items: center; justify-content: center;
}
.wtgs-modal-hero img.wtgs-photo { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
.wtgs-modal-hero img.wtgs-cat-icon { width: 120px; height: 120px; filter: drop-shadow(0 3px 10px rgba(0,0,0,0.3)); }
.wtgs-modal-close {
  position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
  background: rgba(0,0,0,0.5); color: #fff; border: none; border-radius: 50%;
  font-size: 20px; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center;
}
.wtgs-modal-body { padding: 24px; }
.wtgs-modal-title { font-size: 22px; font-weight: 700; color: #1a365d; margin: 0 0 4px 0; }
.wtgs-modal-badge { display: inline-block; background: #1a1a1a; color: #f6d13b; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
.wtgs-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.wtgs-modal-field label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.wtgs-modal-field span { font-size: 14px; color: #334155; }
.wtgs-modal-desc { font-size: 14px; line-height: 1.6; color: #475569; margin-bottom: 16px; }
.wtgs-modal-submitter { font-size: 13px; color: #64748b; font-style: italic; margin-bottom: 16px; }
.wtgs-modal-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.wtgs-modal-actions a {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 24px; background: #1a1a1a; color: #f6d13b;
  text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 15px;
  transition: background 0.2s;
}
.wtgs-modal-actions a:hover { background: #333; color: #f6d13b; }

/* Carousel */
.wtgs-carousel{position:relative;width:100%;height:100%;overflow:hidden}
.wtgs-carousel-slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity .5s ease}
.wtgs-carousel-slide.active{opacity:1}
.wtgs-carousel-slide img{width:100%;height:100%;object-fit:cover}
.wtgs-carousel-btn{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;font-size:18px;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.wtgs-carousel-btn:hover{background:rgba(0,0,0,.7)}
.wtgs-carousel-btn.prev{left:8px}
.wtgs-carousel-btn.next{right:8px}
.wtgs-carousel-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3}
.wtgs-carousel-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;padding:0;cursor:pointer}
.wtgs-carousel-dot.active{background:#fff}

/* Share buttons */
.share-buttons{display:flex;gap:10px;margin-top:20px;padding-top:20px;border-top:1px solid #eee;flex-wrap:wrap;align-items:center}
.share-buttons span{font-size:13px;color:#888;font-weight:500}
.share-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;text-decoration:none;transition:transform .2s,opacity .2s;cursor:pointer;border:none}
.share-btn:hover{transform:scale(1.1);opacity:.9}
.share-btn svg{width:20px;height:20px;fill:white}
.share-btn.facebook{background:#1877F2}
.share-btn.twitter{background:#000}
.share-btn.whatsapp{background:#25D366}
.share-btn.pinterest{background:#E60023}
.share-btn.email{background:#EA4335}
.share-btn.discord{background:#5865F2}
.share-btn.copy-link{background:#718096}
.share-btn.copy-link.copied{background:#48BB78}
.share-btn.share-image{background:#2d8659}

@media (max-width: 1100px) {
  .wtgs-adventures-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .wtgs-featured-section { padding: 35px 16px; }
  .wtgs-featured-header { flex-direction: column; align-items: flex-start; gap: 8px; padding: 0 16px; }
  .wtgs-featured-header h2 { font-size: 22px; }
  .wtgs-adventures-grid { grid-template-columns: 1fr; gap: 16px; padding: 0 16px; }
  .wtgs-card-image { height: 180px; }
  .wtgs-modal { max-height: 95vh; border-radius: 16px 16px 0 0; }
  .wtgs-modal-hero { height: 200px; }
  .wtgs-modal-actions { flex-direction: column; }
  .wtgs-modal-actions a { justify-content: center; }
}
</style>

<div class="wtgs-featured-section">
  <div class="wtgs-featured-header">
    <h2>Featured Adventures</h2>
    <a href="/explore">View All Adventures →</a>
  </div>
  <div class="wtgs-adventures-grid" id="wtgs-featured-grid">
    <div class="wtgs-loading">
      <div class="wtgs-loading-spinner"></div>
      Loading adventures...
    </div>
  </div>
</div>
<div class="wtgs-modal-overlay" id="wtgs-modal-overlay">
  <div class="wtgs-modal" id="wtgs-modal"></div>
</div>

<script>
(function() {
  var GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAuWMOtbz5ZyoV4LNKLBMi9-HdKEYo_bsCykVpn639RE2Z6l4oHjpt_Qtf_EXaWtnDSA/exec';

  var categoryColors = {
    'Camping':'#1fbb00','Natural Point of Interest':'#317700','National Registry Historic Trail':'#736357',
    'Summer Camp':'#c1272d','National High Adventure Base':'#fbb03b',
    'Non-Registry Historic Trail, Event, or Point of Interest':'#c69c6d',
    'Climbing':'#b22259','Hiking':'#22b573','Cycling':'#f4932a','Skiing':'#0063aa',
    'Orienteering':'#9e0025','Bird Mammal Watching':'#5e7054','Snorkeling':'#2e3192',
    'SCUBA':'#29abe2','Swimming':'#297ce2','Fishing':'#35536d','Conservation':'#007768',
    'Rowing/Canoeing/Rafting/Sailing':'#29abe2','Rowing/Canoeing/Rafting':'#29abe2',
    'Shooting Sports':'#c1272d','Council/District Special Event':'#007768',
    'International Event':'#990098','Surfing':'#0020aa','Caving / Spelunking':'#f04d27','50-Miler':'#b1372a'
  };

  function getCategoryIcon(category) {
    return (typeof _WTGS_ICONS !== 'undefined' && _WTGS_ICONS[category]) ? _WTGS_ICONS[category] : null;
  }

  function darkenColor(hex, pct) {
    var num = parseInt(hex.replace('#',''),16), amt = Math.round(2.55*pct);
    var R = Math.max((num>>16)-amt,0), G = Math.max((num>>8&0xFF)-amt,0), B = Math.max((num&0xFF)-amt,0);
    return '#'+(0x1000000+R*0x10000+G*0x100+B).toString(16).slice(1);
  }

  function getBg(cat) {
    var color = categoryColors[cat] || '#1a365d';
    return 'linear-gradient(135deg,'+color+' 0%,'+darkenColor(color,20)+' 100%)';
  }

  function escapeHTML(str) {
    if (!str) return '';
    var d = document.createElement('div'); d.textContent = str; return d.innerHTML;
  }

  function getViewableImageUrl(url) {
    if (!url) return null;
    if (url.includes('drive.google.com')) {
      var m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (m) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w600';
    }
    if (url.startsWith('http')) return url;
    return null;
  }

  function collectImages(a) {
    var urls = [];
    var cols = ['Image Upload (Optional)','Second Image Upload (Optional)','Third Image Upload (Optional)','Group Image Upload (Optional)'];
    for (var i = 0; i < cols.length; i++) {
      var v = a[cols[i]] || '';
      if (v) { var u = getViewableImageUrl(v); if (u) urls.push(u); }
    }
    return urls;
  }

  var featuredData = [];

  function renderCards(adventures) {
    featuredData = adventures;
    var grid = document.getElementById('wtgs-featured-grid');

    if (adventures.length === 0) {
      grid.innerHTML = '<p style="text-align:center;color:#64748b;">No featured adventures found.</p>';
      return;
    }

    var html = '';
    for (var i = 0; i < adventures.length; i++) {
      var a = adventures[i];
      var name = escapeHTML(a['Experience Name'] || 'Adventure');
      var category = a['Category'] || '';
      var description = escapeHTML(a['Description'] || 'An amazing scouting adventure awaits.');
      var city = a['City'] || '';
      var state = a['State'] || '';
      var imageUrl = getViewableImageUrl(a['Image Upload (Optional)'] || a['Image'] || a['Image URL'] || '');

      var location = '';
      if (city && state) location = city + ', ' + state;
      else if (city) location = city;
      else if (state) location = state;

      var bg = getBg(category);

      html += '<div class="wtgs-card" data-index="' + i + '">';
      html +=   '<div class="wtgs-card-image" style="background:' + bg + ';">';
      if (imageUrl) {
        html += '<img class="wtgs-photo" src="' + imageUrl + '" alt="' + name + '" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">';
      } else {
        var iconUrl = getCategoryIcon(category);
        if (iconUrl) {
          html += '<img class="wtgs-cat-icon" src="' + iconUrl + '" alt="' + escapeHTML(category) + '">';
        }
      }
      html += '<span class="wtgs-card-category">' + escapeHTML(category) + '</span>';
      html += '</div>';
      html += '<div class="wtgs-card-content">';
      html += '<h3 class="wtgs-card-title">' + name + '</h3>';
      html += '<p class="wtgs-card-desc">' + description + '</p>';
      if (location) {
        html += '<span class="wtgs-card-location"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>' + escapeHTML(location) + '</span>';
      }
      html += '</div></div>';
    }
    grid.innerHTML = html;

    // Attach click handlers
    var cards = grid.querySelectorAll('.wtgs-card');
    for (var j = 0; j < cards.length; j++) {
      cards[j].addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-index'));
        openModal(featuredData[idx], idx);
      });
    }
  }

  function openModal(a, index) {
    var overlay = document.getElementById('wtgs-modal-overlay');
    var modal = document.getElementById('wtgs-modal');

    var name = escapeHTML(a['Experience Name'] || 'Adventure');
    var category = a['Category'] || '';
    var description = escapeHTML(a['Description'] || '');
    var city = a['City'] || '';
    var state = a['State'] || '';
    var season = a['Season'] || '';
    var cost = a['Cost'] || '';
    var ageRange = a['Age Range'] || '';
    var duration = a['Duration'] || '';
    var activityUrl = a['Activity Website (URL)'] || '';
    var firstName = a['First Name'] || '';
    var position = a['Unit Position'] || '';
    var unitType = a['Unit Type'] || '';
    var unitNumber = a['Unit Number'] || '';
    var council = a['Council'] || '';
    var bg = getBg(category);
    var imgs = collectImages(a);

    // Best image for sharing: Group Image first, then others
    var _shareImg = '';
    var _shareCols = ['Group Image Upload (Optional)','Image Upload (Optional)','Second Image Upload (Optional)','Third Image Upload (Optional)'];
    for (var _sp = 0; _sp < _shareCols.length; _sp++) {
      var _sv = a[_shareCols[_sp]] || '';
      if (_sv) { var _su = getViewableImageUrl(_sv); if (_su) { _shareImg = _su; break; } }
    }

    var location = '';
    if (city && state) location = city + ', ' + state;
    else if (city) location = city;

    var submitter = '';
    if (firstName || position || unitType || unitNumber || council) {
      submitter = (firstName + (firstName && position ? ' - ' : '') + position + ' ' + unitType + ' ' + unitNumber + (unitNumber && council ? ' - ' : '') + council).trim();
    }

    // Build hero content
    var heroContent = '';
    if (imgs.length > 1) {
      heroContent = _wtgsCarousel(imgs);
    } else if (imgs.length === 1) {
      heroContent = '<img class="wtgs-photo" src="' + imgs[0] + '" referrerpolicy="no-referrer">';
    } else {
      var modalIconUrl = getCategoryIcon(category);
      if (modalIconUrl) {
        heroContent = '<img class="wtgs-cat-icon" src="' + modalIconUrl + '" alt="' + escapeHTML(category) + '">';
      }
    }

    var h = '';
    h += '<div class="wtgs-modal-hero" style="background:' + bg + ';">';
    h += heroContent;
    h += '<button class="wtgs-modal-close" onclick="_closeModal()">&times;</button>';
    h += '</div>';
    h += '<div class="wtgs-modal-body">';
    h += '<h2 class="wtgs-modal-title">' + name + '</h2>';
    if (category) h += '<span class="wtgs-modal-badge">' + escapeHTML(category) + '</span>';
    h += '<div class="wtgs-modal-grid">';
    if (location) h += '<div class="wtgs-modal-field"><label>Location</label><span>' + escapeHTML(location) + '</span></div>';
    if (season) h += '<div class="wtgs-modal-field"><label>Season</label><span>' + escapeHTML(season) + '</span></div>';
    if (cost) h += '<div class="wtgs-modal-field"><label>Cost</label><span>' + escapeHTML(cost) + '</span></div>';
    if (ageRange) h += '<div class="wtgs-modal-field"><label>Age Range</label><span>' + escapeHTML(ageRange) + '</span></div>';
    if (duration) h += '<div class="wtgs-modal-field"><label>Duration</label><span>' + escapeHTML(duration) + '</span></div>';
    h += '</div>';
    if (description) h += '<div class="wtgs-modal-desc">' + description + '</div>';
    if (submitter) h += '<div class="wtgs-modal-submitter">Respectfully Submitted By: ' + escapeHTML(submitter) + '</div>';
    h += '<div class="wtgs-modal-actions">';
    if (activityUrl) h += '<a href="' + escapeHTML(activityUrl) + '" target="_blank">View Details &rarr;</a>';
    h += '<a href="https://beascout.scouting.org/" target="_blank">Be a Scout!</a>';
    h += '</div>';

    // Social sharing
    var directLink = 'https://www.wheretogoscouting.com/explore?adventure=' + encodeURIComponent(a['Experience Name'] || '');
    var _slug = (a['Experience Name'] || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').substring(0, 100);
    var shareUrl = 'https://share.wheretogoscouting.com/share/' + _slug;
    var shareText = 'Check out ' + (a['Experience Name'] || 'this adventure') + ' on Where To Go Scouting!';
    h += '<div class="share-buttons">';
    h += '<span>Share this adventure:</span>';
    h += '<a href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl) + '&quote=' + encodeURIComponent(shareText) + '" target="_blank" class="share-btn facebook" title="Share on Facebook"><svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>';

function _wSlide(id,dir){
  var el=document.getElementById(id);if(!el)return;

function _copyLink(text, btn) {

}
function _fallbackCopy(text, btn) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); _showCopied(btn); } catch(e) { prompt('Copy this link:', text); }
  document.body.removeChild(ta);
}
function _showCopied(btn) {
  if (!btn) return;

}

function _shareWatermarked(imgUrl, title) {
  var btn = event ? event.currentTarget : null;
  if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; }
  var photo = new Image();
  photo.crossOrigin = 'anonymous';
  photo.onload = function() {
    var logo = new Image();
    logo.onload = function() {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      canvas.width = photo.naturalWidth;
      canvas.height = photo.naturalHeight;
      ctx.drawImage(photo, 0, 0);
      var logoW = Math.max(canvas.width * 0.15, 120);
      var logoH = logoW * (logo.naturalHeight / logo.naturalWidth);
      var pad = Math.max(canvas.width * 0.02, 10);
      var lx = canvas.width - logoW - pad;
      var ly = canvas.height - logoH - pad;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      var bgPad = 4;
      ctx.beginPath();
      ctx.roundRect(lx - bgPad, ly - bgPad, logoW + bgPad*2, logoH + bgPad*2, 6);
      ctx.fill();
      ctx.drawImage(logo, lx, ly, logoW, logoH);
      try {
        canvas.toBlob(function(blob) {
          if (!blob) { window.open(imgUrl,'_blank'); if(btn){btn.disabled=false;btn.style.opacity='1';} return; }
          var file = new File([blob], (title||'adventure') + '.png', {type:'image/png'});
          if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
            navigator.share({title: title + ' - Where To Go Scouting', text: 'Check out ' + title + ' on Where To Go Scouting!', files:[file]}).catch(function(){}).finally(function(){ if(btn){btn.disabled=false;btn.style.opacity='1';} });
          } else {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a'); a.href = url; a.download = (title||'adventure').replace(/[^a-zA-Z0-9 ]/g,'') + '_WTGS.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
            if(btn){btn.disabled=false;btn.style.opacity='1';btn.classList.add('copied');btn.title='Downloaded!';setTimeout(function(){btn.classList.remove('copied');btn.title='Download Share Image';},2000);}
          }
        }, 'image/png');
      } catch(e) { window.open(imgUrl,'_blank'); if(btn){btn.disabled=false;btn.style.opacity='1';} }
    };
    logo.onerror = function() { window.open(imgUrl,'_blank'); if(btn){btn.disabled=false;btn.style.opacity='1';} };
    logo.src = _WTGS_LOGO;
  };
  photo.onerror = function() { window.open(imgUrl,'_blank'); if(btn){btn.disabled=false;btn.style.opacity='1';} };
  photo.src = imgUrl;
}
