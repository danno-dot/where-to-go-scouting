<style>
.wtgs-featured-section {
  padding: 50px 0;
  background: #f6f4df;
  /* Break out of Squarespace container - aggressive */
  width: 100vw !important;
  max-width: 100vw !important;
  position: relative;
  left: 50%;
  transform: translateX(-50%);
  box-sizing: border-box;
}

.wtgs-featured-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1400px;
  margin: 0 auto 30px auto;
  padding: 0 40px;
}

.wtgs-featured-header h2 {
  font-size: 28px;
  font-weight: 700;
  color: #1a365d;
  margin: 0;
}

.wtgs-featured-header a {
  color: #3182ce;
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
}

.wtgs-featured-header a:hover {
  text-decoration: underline;
}

.wtgs-adventures-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 40px;
}

.wtgs-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  transition: all 0.3s;
  text-decoration: none;
  color: inherit;
  display: block;
}

.wtgs-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 35px rgba(0,0,0,0.15);
}

.wtgs-card-image {
  height: 180px;
  background-size: cover;
  background-position: center;
  position: relative;
  overflow: hidden;
}

.wtgs-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
  position: relative;
}

.wtgs-card-category {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(26,54,93,0.9);
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.wtgs-card-content {
  padding: 20px;
}

.wtgs-card-title {
  font-size: 18px;
  font-weight: 700;
  color: #1a365d;
  margin: 0 0 8px 0;
}

.wtgs-card-desc {
  color: #64748b;
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 16px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.wtgs-card-location {
  color: #64748b;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.wtgs-card-location svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

.wtgs-loading {
  text-align: center;
  padding: 60px 20px;
  color: #64748b;
  font-size: 16px;
}

.wtgs-loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #e2e8f0;
  border-top-color: #FFCE00;
  border-radius: 50%;
  animation: wtgs-spin 1s linear infinite;
  margin: 0 auto 16px;
}

@keyframes wtgs-spin {
  to { transform: rotate(360deg); }
}

/* Tablet - 2 columns */
@media (max-width: 1100px) {
  .wtgs-adventures-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Mobile - 1 column */
@media (max-width: 600px) {
  .wtgs-featured-section {
    padding: 35px 16px;
  }

  .wtgs-featured-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 0 16px;
  }

  .wtgs-featured-header h2 {
    font-size: 22px;
  }

  .wtgs-adventures-grid {
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 0 16px;
  }

  .wtgs-card-image {
    height: 180px;
  }
}
</style>

<div class="wtgs-featured-section">
  <div class="wtgs-featured-header">
    <h2>Featured Adventures</h2>
    <a href="/explore">View All Adventures →</a>
  </div>
  <div class="wtgs-adventures-grid" id="wtgs-featured-grid">
    <div class="wtgs-loading">
      <div class="wtgs-loading-spinner"></div>
      Loading adventures...
    </div>
  </div>
</div>

<script>
(function() {
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAuWMOtbz5ZyoV4LNKLBMi9-HdKEYo_bsCykVpn639RE2Z6l4oHjpt_Qtf_EXaWtnDSA/exec';
  
  // Category colors matching your map icons
  const categoryColors = {
    'Order of the Arrow': '#901211',
    'Camping': '#1fbb00',
    'Natural Point of Interest': '#317700',
    'National Registry Historic Trail': '#736357',
    'Summer Camp': '#c1272d',
    'National High Adventure Base': '#fbb03b',
    'Non-Registry Historic Trail, Event, or Point of Interest': '#c69c6d',
    'Climbing': '#b22259',
    'Hiking': '#22b573',
    'Cycling': '#f4932a',
    'Skiing': '#0063aa',
    'Orienteering': '#9e0025',
    'Bird Mammal Watching': '#5e7054',
    'Snorkeling': '#2e3192',
    'SCUBA': '#29abe2',
    'Swimming': '#297ce2',
    'Fishing': '#35536d',
    'Conservation': '#007768',
    'Rowing/Canoeing/Rafting/Sailing': '#29abe2',
    'Rowing/Canoeing/Rafting': '#29abe2',
    'Shooting Sports': '#c1272d',
    'Council/District Special Event': '#007768',
    'International Event': '#990098',
    'Surfing': '#0020aa',
    'Caving / Spelunking': '#f04d27',
    '50-Miler': '#b1372a'
  };

  function getGradientForCategory(category) {
    const color = categoryColors[category] || '#1a365d';
    return `linear-gradient(135deg, ${color} 0%, ${darkenColor(color, 20)} 100%)`;
  }

  function darkenColor(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max((num >> 16) - amt, 0);
    const G = Math.max((num >> 8 & 0x00FF) - amt, 0);
    const B = Math.max((num & 0x0000FF) - amt, 0);
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
  }

  function escapeHTML(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function getViewableImageUrl(url) {
    if (!url) return null;
    
    // Handle Google Drive file URLs
    // Format: https://drive.google.com/open?id=XXXXX or https://drive.google.com/file/d/XXXXX/view
    let fileId = '';
    
    if (url.includes('drive.google.com')) {
      // Try to extract file ID from various Google Drive URL formats
      const openIdMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      const fileIdMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      const ucIdMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      
      if (openIdMatch) {
        fileId = openIdMatch[1];
      } else if (fileIdMatch) {
        fileId = fileIdMatch[1];
      } else if (ucIdMatch) {
        fileId = ucIdMatch[1];
      }
      
      if (fileId) {
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=w600`;
      }
    }
    
    // Return original URL if not a Google Drive link
    if (url.startsWith('http')) {
      return url;
    }
    
    return null;
  }

  function renderCards(adventures) {
    const grid = document.getElementById('wtgs-featured-grid');
    
    if (adventures.length === 0) {
      grid.innerHTML = '<p style="text-align: center; color: #64748b;">No featured adventures found.</p>';
      return;
    }

    grid.innerHTML = adventures.map(adventure => {
      const name = escapeHTML(adventure['Experience Name'] || 'Adventure');
      const category = adventure['Category'] || '';
      const description = escapeHTML(adventure['Description'] || 'An amazing scouting adventure awaits.');
      const city = adventure['City'] || '';
      const state = adventure['State'] || '';
      
      // Try multiple possible column names for images
      const imageField = adventure['Image Upload (Optional)'] || adventure['Image'] || adventure['Image URL'] || '';
      const imageUrl = getViewableImageUrl(imageField);
      
      let location = '';
      if (city && state) {
        location = `${city}, ${state}`;
      } else if (city) {
        location = city;
      } else if (state) {
        location = state;
      }

      const gradientBg = getGradientForCategory(category);

      return `
        <a href="/maps" class="wtgs-card">
          <div class="wtgs-card-image" style="background: ${gradientBg};">
            ${imageUrl ? `<img src="${imageUrl}" alt="${escapeHTML(name)}" referrerpolicy="no-referrer" onerror="this.style.display='none';">` : ''}
            <span class="wtgs-card-category">${escapeHTML(category)}</span>
          </div>
          <div class="wtgs-card-content">
            <h3 class="wtgs-card-title">${name}</h3>
            <p class="wtgs-card-desc">${description}</p>
            ${location ? `
              <span class="wtgs-card-location">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                ${escapeHTML(location)}
              </span>
            ` : ''}
          </div>
        </a>
      `;
    }).join('');
  }

  // Fetch and display adventures
  fetch(GOOGLE_SCRIPT_URL)
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      if (data.error) {
        throw new Error(data.error);
      }
      
      const allAdventures = data.rows || [];
      
      // Filter for featured adventures (Published Status = "Featured")
      let featured = allAdventures.filter(a => {
        const status = (a['Published Status'] || '').toLowerCase().trim();
        return status === 'featured';
      });

      // Limit to 4 featured
      featured = featured.slice(0, 4);

      renderCards(featured);
    })
    .catch(error => {
      document.getElementById('wtgs-featured-grid').innerHTML = 
        '<p style="text-align: center; color: #64748b;">Unable to load featured adventures.</p>';
    });
})();
</script>
